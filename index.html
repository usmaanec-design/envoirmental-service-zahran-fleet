    <!-- Custom scrollbar styles -->
    <style>
      /* Custom scrollbar styles for better visibility */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #9ca3af #f3f4f6;
      }
      
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f3f4f6;
        border-radius: 4px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #9ca3af;
        border-radius: 4px;
      }
      
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #6b7280;
      }
      
      /* Dark mode scrollbar */
      .dark .custom-scrollbar {
        scrollbar-color: #6b7280 #374151;
      }
      
      .dark .custom-scrollbar::-webkit-scrollbar-track {
        background: #374151;
      }
      
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #6b7280;
      }
      
      .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
      }
    </style>
  <script type="importmap">
{

<script>
  // Add dark mode support to Tailwind
  tailwind.config = {
    darkMode: 'class',
  }
  // Immediately apply theme to prevent FOUC
  if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark')
  } else {
    document.documentElement.classList.remove('dark')
  }
</script>
<style>
  @keyframes fade-in-down {
    from {
      opacity: 0;
      transform: translateY(-15px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fade-in-down {
    animation: fade-in-down 0.6s ease-out forwards;
  }
  
  @keyframes fade-in-scale-up {
    from {
      opacity: 0;
      transform: scale(0.95);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }
  .animate-fade-in-scale-up {
    animation: fade-in-scale-up 0.7s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
  }
  
  @keyframes shake {
    10%, 90% { transform: translate3d(-1px, 0, 0); }
    20%, 80% { transform: translate3d(2px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
    40%, 60% { transform: translate3d(4px, 0, 0); }
  }
  .animate-shake {
    animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
  }

  /* Utility to hide scrollbars */
  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .hide-scrollbar {
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
  }

  /* Custom scrollbar for service types list */
  .service-types-scroll::-webkit-scrollbar {
    width: 8px;
  }
  .service-types-scroll::-webkit-scrollbar-track {
    background: #f3f4f6;
    border-radius: 4px;
  }
  .dark .service-types-scroll::-webkit-scrollbar-track {
    background: #374151;
  }
  .service-types-scroll::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 4px;
    border: 1px solid #f3f4f6;
  }
  .dark .service-types-scroll::-webkit-scrollbar-thumb {
    background: #6b7280;
    border: 1px solid #374151;
  }
  .service-types-scroll::-webkit-scrollbar-thumb:hover {
    background: #9ca3af;
  }
  .dark .service-types-scroll::-webkit-scrollbar-thumb:hover {
    background: #9ca3af;
  }
  /* Firefox scrollbar styling */
  .service-types-scroll {
    scrollbar-width: thin;
    scrollbar-color: #d1d5db #f3f4f6;
  }
</style>
